
name: Build Light Image EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Light-image Light_img.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Light-image-Windows
          path: dist/Light-image.exe
          retention-days: 30
